- date: "2026-01-13 00:50:01"
  content: |-
    讲一下刚刚过去的那一天究竟发生了些什么吧。

    起因是晚上十点左右，正是我们每日宿舍签到的时间。我敬爱的mentor——一个读博士的学长，私信我说“签到后留下来”。

    这怕不是出大问题了，或者说更可怕的是，我不知道问题出在哪里了。我不明白一个主要管我们生活的mentor怎么就专门盯上我了。我们这一批学生一共82人，归他管理的有不到三十个，怎么就把我这三十分之一单独揪出来了？

    我是带着疑惑爬上楼的。

    他来的很从容，仿佛什么事情都没有。大概7年的南洋理工学术生活锻炼出了他日常的松弛感。但谁都清楚，这些博士表面一个比一个摆，真要干起正事一个比一个牛逼。这位学长学术上的战绩google scholar上真实可查。多方因素夹杂在一起，让我对他的态度远超于一个对学长的态度。

    他说没什么大事，甚至还反问我会有什么大事。既然没有大事，那为什么不直接跟我说？看来还不是一件小事。

    终于，三局皇室战争之后，所有同学陆陆续续签完了到，轮到我的环节了。他邀请我坐到他的旁边，表情瞬间凝重了起来。

    “你跟同学们关系怎样？”

    我惊的手一颤，把哥布林飞桶向右扔偏了一格，差点砸到国王塔上。

    我迷茫的看着他肃穆的双眼，不知道如何回应。

    显然他是说中了，我与多数同学的关系并不好，但也不坏。说人话，应该算是没有关系。多数人都是礼节性的加了微信或者某门课学术上的小组合作。要说是关系差到极点，那必然是我那个傻逼室友了。我早就已经不把他当人看了。

    很好，事情发展到这一步，我已经猜出来是谁先告状的了。结果很清楚，学长听了傻逼室友的哭诉，为了履行职责，与我谈话。这样看来，学长是负责的好人，而傻逼室友是黔驴技穷的巨婴。宁可麻烦本就任务繁多（包括帮导师批作业）的博士生来解决孩子们之间的不和气，也不自己去解决。哪怕他破口大骂，在寝室里把我痛骂一顿，我也会觉得他终于长成有骨气的人了。

    我最为厌恶的傻逼使用了我最瞧不起的方法来试图介入一段我早就忽略的关系，你说我的答案是什么？

    忽视。

    此时谈话只是刚刚开始，我已然知道接下来会发生什么。接下来就该反向套取信息来佐证我的观点来。

    然后是常规的问答环节。诸如“我的朋友是谁”“我跟室友关系怎样“”平时去不去图书馆“之类嘘寒问暖的回答。我一方面嘴上应付，一方面桥头王子加哥布林团伙直接拿下来一个公主塔——对面刚换路沉底圣水戈仑，这是我唯一的反击方式。

    他见我情绪愈加低下，放出来了大招。这是惯用伎俩。

    ”我看你在这八十多人里面排第一啊。“

    这可完全的出乎意料，我的注意力完全被抓住了，当然，接下来的对话完全围绕着我们的成绩排名展开。我向他连番追问的时候，能清晰的看见他懊悔的神情。

    礼貌性的告别之后，能感受到他松了一口气。这不是什么新鲜事，因为我们二人都在完成任务，而始作俑者就是那个傻逼室友。

    我可以写一整篇文章来批判傻逼室友，但不是在这里。

    ---

    还是补充一下我与室友的关系吧，我认为他是一个有毒的人。他虚伪，竞争性强且遍布方方面面，表演性人格，极度缺乏安全感，小孩思维，爱装逼爱反问别人，见人说人话见鬼说鬼话，缺乏自我且热衷于模仿他人，完美踩中了我的所有雷点，在试图与他正常交往了一个月后，我果断的淡出了这段关系。我不能容忍这样一个毒物对我的精神持续攻击。

    今日他向学长提出了这个请求，表明他急了，他缺乏了对我的掌控感，很不舒服很不爽。没办法，在外面给别人当孙子当久了，那在我这也别想直起腰来。要是有骨气，就少通过这种幼儿园的方式来解决这么一个小小的问题。如你所见，问题不但没解决，反而更重了。但是在我看来这本来不是一个问题，可你非要旧事重提，那就别怪我攻击你了。
