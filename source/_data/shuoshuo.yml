    你可以看到这几天完全没有发文章，我大概总结一下发生了什么。

    上一次发文章过后，我结束了在山东省的旅行，回到了美丽的长春，开启了为期一周的家中躺平生活。这次主动的躺平，让我获得了心灵的宁静与一天只吃两顿饭的好习惯，后者有利于我在饭菜好比金子贵的新加坡节约大量资金

    然后，1月3日，1月4日，我用了两天的时间从北纬43度跃迁到北纬1度，乍到新加坡樟宜机场完全不适应，异国他乡的流浪感一下子涌上心头。加之傻逼酷航强制托运了我随身带包包，导致我必须抱着珍贵的游戏本坐完长达六小时的夜猫子航班。显然我一夜未眠。

    事情的转机发生在1月4日晚上——没错就是这么快，我网购的显示器到货了，从此我打开了新世界。非常后悔，为什么不一开始就把显示器买到宿舍里，这玩意只要不是把钱花在什么外设什么贼高的刷新率上，几乎是百分百的性价比。我感觉这个显示器完全能陪伴我接下来四年半的大学生活，甚至毕业了我还能出给别人。回收本金是完全可能的

    然后就是现在了。在刚刚过去的一天里，我们开学了。到没有什么不适应，反倒是十分的亲切，因为终于有理由让自己忙起来了。要是一直躺着无所事事，那种空虚感是比过度劳累后的疲乏还要恐惧的

    这一周没有写文章，原因同样是玩的太嗨了，且没有什么充沛的情绪来发挥。

    充沛情绪的产生，要么是受到外界的触动，要么是喝了酒，要么是被一些傻逼人和事情所困扰。这一周，傻逼室友没有回来，傻逼作业没有找上门，我又没有闲钱独酌，因此整体情绪较为平淡。

    今日突然想起写点什么，自然是受到了一些刺激。索性直接打开电脑把能想到的东西统统写出来。
