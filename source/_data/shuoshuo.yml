    我真他妈服了，傻逼室友和幼儿园小朋友一样，自己气不过就找学生中心告状了。

    我最恼火的是他耽误了我宝贵的时间，起码两个小时，以及附带而产生的情绪等。将这些精力这些时间拿来睡觉拿来玩乐拿来学习，创造的价值远远高于坐在那里重复自己的立场，

    我并不认为把傻逼室友看作一个物体是什么大错，因此我丝毫不担心此事对我的影响；如果傻逼室友向他周边的狐朋狗友散布情绪，那我自然就了解了那些情绪化的傻逼的嘴脸，然后将他们一并视为物体。

    可怜的室友，因为我拒不配合他的演出，拒不配合接受他的主导，拒不配合的照顾他的情绪，拒不配合的把他当成一个人来看。

    你几把谁啊？你真把自己当成什么了？你就是歌姬

    可怜的室友出现了被害妄想症，这点可在他的陈词中显现：
    - 他半夜两点回宿舍发现门锁了，于是认定是我故意为难他
    - 他半夜起床发现我的显示器还亮着，于是认定我半夜偷偷起来打游戏了，并且影响到了他的生活
    - 他桌子上无论因为何种原因而出现的菜汤饭粒等，一律都是我为了报复他而干的
    - 我晚上打游戏，键盘发出的声音是对他的挑衅
    - 他认为我会欺负他，于是故意躲着我，早出晚归

    我的评价是，人能把自己活成这样，也真是憋屈到家了。也没错，他在外面做着小丑表演，谄媚的像一个孙子，回到宿舍，要是再缺乏一些掌控感，岂不是真要憋屈一辈子了？

    所以啊，他“忍无可忍”，爆发了。

    于是我反问，你忍着干什么呢？谁让你忍着了？你忍着有什么好处吗？

    他眨眼睛眼角泛红，一句话也不说

    好吗，果然是骨子里的奴性，很难想象他接受了怎样的家教。

    我想起来之前的一次吵架，他哭诉自己“受过童年创伤”“很胆小”“内心很脆弱”，里里外外都是在警告我他是一个“易碎的花瓶”。

    当时我都要笑出来了，我他妈还是精神病呢，哪天看你不顺眼了直接一刀把你砍死，你是不是还要原谅我啊？

    所以啊，我操你妈，要是脆弱到这个程度，就滚回山里种地去，让老子舒舒服服的住单人宿舍
