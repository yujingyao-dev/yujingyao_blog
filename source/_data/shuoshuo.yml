    先说一下更新计划吧：
    - 之前给自己起草了一些回忆录性质的文章，多半是回忆初高中的老师与同学。最近回来还与一个同学吃了饭，我还可以写一些他
    - 最近升级了一些外设，从筹集升级外设的钱财到最终打造还算不错的“电竞宿舍”，我有很多话想要说
    - 最近想学虚幻引擎，一些笔记会传上来。由于本人之前主要是学python，因此有一些从python转到c++的感悟，也会一并发出
    - 崩坏星穹铁道的货币战争太好玩了，遇到好的配队会单开一栏详细讲讲
    - 很久以前就迷上了各种剧情向的rpg游戏，一遇到有感悟的剧情，就会闲聊几句
    - 近期以及以后也有出游的计划，如果真的有所感悟就写写文章，如果没什么感悟就分享一下照片。因此我得抓紧找一个好的图床，不然我的仓库就要爆掉了
    - 重新发现了自己小升初的时候注册的小黑盒，感觉现在的环境真的好好，很适合当匿名朋友圈。因此部分文章也会同步到小黑盒上，姑且算是给网站引流了。

    无所谓，写着写文章纯粹是因为自己想要分享。现在的我看过去小学6年初中3年高中2年，留下的痕迹实在是太少了，照片没有，日记很少，聊天记录早就删完了，之前做的那些ppt或者演讲参与的比赛的材料全部没有备份。我意识到自己的记忆并不足以支撑自己记住一切成长的驻点，且任何一件事不会主动表明自己就能让你成长。写下来这一切也就是想让自己日后有一些追忆往昔的素材，如果能帮到别人，那就更好了（顺便满足一下自己傲娇的分享欲和自尊心）

    有些话很难跟身边熟悉的人讲，陌生的网友们反倒是很好的倾听对象。我不会挑剔一个素不相识的人（除非ta突破底线），我想大家也不会这样对我。在我还相信这个世界的美好时，我争取不让这个博客断更。
