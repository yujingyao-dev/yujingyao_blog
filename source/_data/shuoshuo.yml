- date: "2025-12-19 11:21:16"
  content: |-
    这几天属实是玩疯了，你可以看到我已经10天没有更新说说了。假期过的是真快，感觉我好像才回家没多久，就马上要走了。这几天不过是打打游戏刷刷视频，放纵自己吃喝玩乐。很空虚，我必须承认，但是的确很快乐，是这种不用过脑子不用思考不用担忧没有压力的快乐。也许玩着玩着就厌烦了，就想要干点所谓的有用的了。
    但是现在还是放纵的玩更好。一生中能够独立自主的无忧无虑玩乐的时间首先就是现在，其次就是退休后。我很难保证自己何时退休，退休后是否会继续被金钱，家庭，健康等诸多因素牵绊。现在的我不用担心赚钱，不用担心健康，不用担心明天早上能不能吃上饭，除了半年后升入本科要选专业外，几乎没有任何的外部压力。有压力，多半也都是自己给的——希望自己在若干年之后能有竞争力，顺利的入职
    跳槽，升级为高级牛马，卷他个十年，之后要么下海创业，要么背井还乡，挣得钱够我吃利息就行，利息多，就安扎在大城市；利息少，就退居三四线小县城，都是一样活。到那时我已然见识了社会是如何运行的，已然有经过训练与考验的知识储备和经验了，已然在一些领域不再是小白了。到那时，想干什么其实就能干什么，只是怕自己失去了那种奋斗的热忱。
    也好，就那么静静的活着，活够剩下人生的四五十年，也算是圆满了。
    再怎么幻想，现在我才18岁。能干的事情太多了，因此我现在选择打游戏。没什么丢脸的，每个人选择不同罢了。
- date: "2025-12-09 01:35:53"
  content: |-
    今天其实本来不应该在新加坡的，如果不是傻逼学校非要给我们安排三节“workshop”——与国内德育讲座是一类货色，除了浪费时间与彰显所谓的全面发展，我想不出任何理由来支持学校花钱找人把我们聚集在一起。
    也正是傻逼学校硬性规定我们必须在开学前一周回来。妈的，那几天就是机票最贵的时候，几天之后票价反倒便宜的不得了，可是学校哪管你那个？毕竟按照新加坡教育部的设想，我们中国学生寒假应该呆在新加坡接受同化。建议想出这种馊主意的官员自己先去中国生活两年再做评价。我倒要看看你的中文能力能经受几天拷打。
    上课的老师也是相当的傻逼。那颗就是设计好的批量产品，这个老师一定是讲过好多好多遍了——即便如此，开场调试设备的时间就占到了惊人的20分钟。早他妈干什么去了？
    整个讲座也是充满了新加坡人独有的小国寡民的小资产阶级的自傲与偏见。老师列出五套服装，告诉我哪套就是值得信任的，哪套不是；列出五种发型，告诉我哪种发型是规矩的，哪种是不规矩的。
    记住了，一百年前，这玩意叫三纲五常；五十年前，这玩意是“四旧”；现在，这玩意叫刻板印象。真是可悲，你竟然打着“学会塑造个人形象”来灌输歧视性的思想，下次建议你直接跪着舔美国爹的皮鞋。
    我确实是寄人篱下，因此在新加坡不得不低头；但这不代表我的脊梁弯掉了。大是大非，道德观念面前，孰轻孰重我搞的清楚。新加坡也不要自以为是，你的黄金时代已经过去了，现在该想退路，而不是整天在方方面面刷存在感，顺便向国民吹捧自己的优越。
    但是好消息是，我在我的座位上发现了一个三星的65瓦充电头。那就是我的了，今天赚大了，好耶！
    下课竟然还要拍照，我更是直接窜上公交车跑了，去吃肉夹馍和牛肉粉。下午随便找了家咖啡店。起先是看了看书，后来……看前面的内容也知道了，我开始拿AI写了一点游戏，算是打发一下时间了。反正我乐在其中，且最后确实有不错的成果。
    出来的最终目的有两个，一是晚上去酒馆喝酒，二是去酒品专卖店买点啤酒好带回长春喝。上次去酒馆，大概是因为我旁边的同学太显少年气（事实上他的确没有成年），而被服务员以“必须提供纸质护照”为理由拒绝了，这次我带了护照，却没有人说要看，我很顺利的点菜喝酒吃饭。反正我成年了，我有这样做的自由。

    ![小酒馆随便吃点](img/shuoshuo/holland_village.webp)

    看来我确实长的比较憔悴。上次去考试中心认证我的计算器，那里的老师反复拷打我“是不是PhD学生”，搞得我都不知道怎么讲了。难道我要说：我连高中毕业证都没有，我是初中学历吗？倒不是不可以。只是这位老师的三观可能要因此而刷新了。

    酒足饭饱之后心情十分愉悦，于是去店里扫购4罐啤酒，回来之后一层一层的包裹起来，放到了行李箱里。两天之后我就要带走他们回到长春，让这些产自英国生活在新加坡的啤酒也见识一下东北的风情。

    晚上玩了文明6，我选了澳大利亚，焦灼的博弈三百回合之后竟然外交胜利了，也是很意外了。此时已经12点多了，然后你就看到，我写下来了这片动态。
