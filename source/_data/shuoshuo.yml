    年就这样过去了，平平淡淡。
    我买了一桌子卤味，搞了一大瓶啤酒。本想着吃到第二天早上天亮，结果一个小时不到全都吃完了。诚然，醉意上头的时候心情无比愉悦，但代价是酒醒后无比的空虚，更何况那时候才晚上10点。
    就这样，一个酒鬼一身臭汗的上床睡觉了。

    以前盼望过年的原因之一，就是可以正大光明的熬夜。可是熬夜根本不是什么好东西。如果能让我每天晚上八点钟倒在床上就睡，那真是再好不过了。

    可是生活的大部分都不是自己能够掌控的，现有的生活也不过是对大环境妥协的产物。尽管每一分每一秒的确在由我本人支配，但是宏观来看，何尝不是奔着就业生活与未来去的呢？

    能为自己的成长发愁，是难能可贵的。年龄太小，会装嘴硬；年龄太大，会习以为常。只有在这个不上不下的年纪，我才能发出这样矫情的感慨。十年前看，会感觉不明所以；十年后看，会感觉无病呻吟。

    也许这就是人生的规律。大家都是人类，难免逃脱不了这种共性。那就只好这样过吧，毕竟全天下的人类都是这样脆弱不堪的。如果可以假设人类世界局部的持久和平，那么夺回自己生活主动权的必要条件就是银行卡里得有钱。的确是这样，有钱办不成所有事，没钱什么事也办不成。即使世界后天毁灭，我也要确保明天早上能吃饱。

    像我这种目光短浅的生物，看的太长远就是杞人忧天。因此发发牢骚就好了，生活还是要认真一些，不管这是不是你想要的。
