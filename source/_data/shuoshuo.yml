    才反应过来这个网站空闲好久了。的确，最近发生的为数不多的大事，就是傻逼室友告状，连带着消耗了我许多精力。本来已经学会无视他了，现在好了还得重新忘却。不过好消息是，除了这件事情之外，生活美好的不能再美好了，当然也平淡的不能再平淡了。

    压力随时回来，一些可以预知的考验已经写在了日程本上。但我觉得这不是盲目着急的理由。泡在图书馆，抄写笔记，大量刷题，看网课，未必就是学习，也未必就是长见识。高中生活告诉我只要投入时间精力狂轰滥炸就能维持较好的分数（毕竟自己的智商就在这里，实在做不到一看就会），大学呢？当然也可以。但是有什么用呢？付出60%的精力能拿90%的分数，付出80%的精力能拿95%的分数，而付出99%的努力只能拿98%的分数，到手的不过都是清一色的A或A+，结果有什么区别吗？并没有。

    目前我感知到的大学学习，学本质学原理是一方面，也是考察的一方面。然而，理解概念和会做题仍然是两回事。因此大学学习的另一方面就是短时间内练出应试技巧——或者更广泛一点，猜透某人心思（出卷人）的技巧。期末周就是拿来突击的，学完了就是拿来遗忘的。如果真的能记下来，那算是额外的收获。

    至于日后遇到的考验，我可以捡起来忘却的旧知；日后遇到的问题，我可以现学现卖、熟能生巧。高中生的思维在高考结束后的那一刻就应该抛弃掉，不要忘记整个高中的学习生涯就是一场针对高考的盛大的现学现卖。这六分之一的人生完全不足以塑造能贯穿你未来五十年人生的不变的世界观。

    因此，每当我看见每日都奔走在图书馆，半夜熬在自习室，结果做题却纠结半天的这一类同学，我都会感到由衷的可怜。他们有智商，有精力，有上进心，却没有用到应该的地方。

    大学生活除去考试外，没什么事是所有人必须的，因此一切取决于自己。机会是随时可以争取的，就在这一天你可以迈出无数步做出翻天覆地的改变——只要你愿意，没什么不可以。

    就说这么多，午饭已经消化的差不多了，我去刷算法题了。
