- date: 2025-12-07T23:05:00.000Z
  content: |
    今天在宿舍光明正大的早有预谋的摆烂了一天。
    零食随便吃，可乐随便喝，短视频随便刷，那些廉价的多巴胺请尽情的霸占我的大脑。
    好久没有享受过这么无脑麻木昏昏欲睡的快感了。事实上我真的睡了好几觉，躺在床上困了就睡不知道什么时候醒。
    冰箱里剩了一点黄油和意大利面，我买了点菜把他们吃完了，毕竟我还有不到三天就要离开这个宿舍了。
    中午吃的很清淡：水煮娃娃菜配菌菇意大利面。也是把意大利面吃出了挂面的感觉。说实话，口感很像李先生牛肉面的那种压出来的面条，不能说难吃，但也没有好吃到哪里去。

    <img src="/img/shuoshuo/lunch_12072025.jpg">

    晚餐不是很饿，没有主食，只是利用剩下的黄油煎了鸡胸肉，炒了豆角。豆角我怕炒不熟，提前水煮了一遍，结局就是吃来水泠泠的，完全没有黄油那种油脂的香气与豆角表皮的焦脆感。看来下次只需要过一遍热水就好，油还要多一些，像炸豆角一样，就会很脆。

    <img src="/img/shuoshuo/dinner_12072025.jpg">

    明天上午有一个傻逼讲座，去那里混一混，下午打算随便找家咖啡馆看看书写写文章。晚上去酒馆喝点小酒。
    后天上下午都有傻逼讲座，那就人去到那里就好，回来了就收拾一下行李，洗洗衣服，晚上早点睡。
    虽然飞机是后天晚上五点的，但我还想一早起来就坐地铁走。樟宜机场内部我还没怎么看过，这下我将有足够的时间去探索了。
    期待周四回到家乡长春。毕竟是第一次背井离乡，换谁都会如此的思乡。也许慢慢的就适应了。毕竟新加坡的机遇还是远远多于长春的，新加坡的限制还是远远小于北京上海的。来到这里了，就充分利用身边的一切。
